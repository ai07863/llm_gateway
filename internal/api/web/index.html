<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>LLM Gateway 用量看板</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
</head>
<body>
<h1>LLM Gateway</h1>
<p>本月花费：<span id="cost">-</span> 元 ｜ 本月节省：<span id="saved">-</span> 元</p>
<canvas id="chart" height="120"></canvas>
<p id="hint">首次使用：填入网关 token 点刷新，之后会记住（或访问 /?token=你的token 免填）：</p>
<input id="token" placeholder="gateway token" />
<button onclick="load()">刷新</button>
<script>
let chart = null;
function fmtYuan(v) {
  return (Number(v) || 0).toFixed(6);
}
function setHint(text) {
  document.getElementById('hint').textContent = text;
}
async function load() {
  const token = document.getElementById('token').value;
  if (token) {
    localStorage.setItem('gateway_token', token);
  }
  let res;
  try {
    res = await fetch('/v1/admin/usage', { headers: { Authorization: 'Bearer ' + token } });
  } catch (e) {
    alert('无法连接网关：' + e.message);
    return;
  }
  if (!res.ok) {
    alert('请求失败：HTTP ' + res.status + (res.status === 401 ? '（token 错误或未填）' : ''));
    return;
  }
  const data = await res.json();
  setHint('已记住 token，下次自动加载：');
  document.getElementById('cost').textContent = fmtYuan(data.month_cost);
  document.getElementById('saved').textContent = fmtYuan(data.month_saved);
  const labels = (data.records || []).map(r => r.created_at || '');
  const costs = (data.records || []).map(r => r.cost || 0);
  if (typeof Chart === 'undefined') {
    alert('图表库未加载（可能离线），仅显示花费数值。');
    return;
  }
  if (chart) chart.destroy();
  chart = new Chart(document.getElementById('chart'), {
    type: 'line',
    data: { labels, datasets: [{ label: '单次成本', data: costs }] },
  });
}
function initToken() {
  const params = new URLSearchParams(location.search);
  const fromURL = params.get('token');
  if (fromURL) {
    localStorage.setItem('gateway_token', fromURL);
    params.delete('token');
    const q = params.toString();
    history.replaceState(null, '', location.pathname + (q ? '?' + q : ''));
    return fromURL;
  }
  return localStorage.getItem('gateway_token') || '';
}
window.addEventListener('DOMContentLoaded', function () {
  const token = initToken();
  if (token) {
    document.getElementById('token').value = token;
    setHint('已自动加载（token 已记住，可用 /?token=... 免填）：');
    load();
  }
});
</script>
</body>
</html>
